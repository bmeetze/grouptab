name: Supabase keep-alive
on:
  schedule:
    - cron: '17 8 * * 1,4'   # Mon & Thu 08:17 UTC — twice weekly, well inside the 7-day pause window
  workflow_dispatch:
permissions:
  actions: write   # lets the job re-enable itself (see the second step)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive RPC
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
        env:
          SUPABASE_URL: https://fsxgzverfxtrqludigdo.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_MnzXAf0p-6ariSDD00jVwQ_-I4dYPHb
      # GitHub disables scheduled workflows after 60 days without a commit
      # (this happened Sep 2026, and the database paused soon after).
      # Re-enabling an active workflow through the API resets that clock, so
      # each run keeps the schedule alive. `always()`: renew even if the ping
      # fails, so a database outage can't also cost us the schedule.
      - name: Renew schedule (60-day inactivity rule)
        if: always()
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
